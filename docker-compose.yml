services:
  rf4-server:
    image: ghcr.io/cattreestreet/rf4_server_simulator:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rf4-server
    restart: unless-stopped
    init: true
    ports:
      - "${RF4_LOGIN_PORT:-443}:443/tcp"
      - "${RF4_REALTIME_PORT:-9341}:9341/tcp"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - rf4-data:/app/data
      - rf4-certs:/app/certs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9501/readyz >/dev/null && curl -fsS http://127.0.0.1:9502/readyz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    stop_grace_period: 20s
volumes:
  rf4-data:
  rf4-certs:
